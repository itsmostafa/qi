version: '3'

vars:
  BINARY: qi

tasks:
  default:
    desc: Build the binary
    deps: [build]

  build:
    desc: Build the qi binary
    sources:
      - "**/*.go"
      - "internal/db/migrations/*.sql"
      - go.mod
      - go.sum
    generates:
      - "{{.BINARY}}"
    vars:
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
      COMMIT:
        sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    cmds:
      - go build -ldflags "-s -w -X github.com/itsmostafa/qi/internal/version.Version={{.VERSION}} -X github.com/itsmostafa/qi/internal/version.Commit={{.COMMIT}} -X github.com/itsmostafa/qi/internal/version.BuildDate={{.DATE}}" -o {{.BINARY}} .

  test:
    desc: Run all unit tests
    cmds:
      - go test ./...

  test:verbose:
    desc: Run all unit tests with verbose output
    cmds:
      - go test -v ./...

  lint:
    desc: Run go vet
    cmds:
      - go vet ./...

  check:
    desc: Run lint and tests
    deps: [lint, test]
